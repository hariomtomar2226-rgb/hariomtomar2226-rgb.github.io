<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hariom Tomar | Data Analyst Portfolio</title>

        tailwind.config = {

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --cursor-x: -1000px;
            --cursor-y: -1000px;
        }

        body {
            transition: background-color 0.45s ease, color 0.45s ease;
            overflow-x: hidden;
        }

        /* Top Scroll Progress Hairline */
        #scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 2.5px;
            width: 0%;
            z-index: 60;
            background: linear-gradient(90deg, rgba(161, 161, 170, 0.4), #ffffff);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: width 0.08s linear;
            pointer-events: none;
        }
        html:not(.dark) #scroll-progress {
            background: linear-gradient(90deg, rgba(100, 116, 139, 0.4), #09090b);
            box-shadow: 0 0 8px rgba(9, 9, 11, 0.25);
        }

        /* Blurred & Faded Background Layer ("data man.jpg") */
        .bg-data-man {
            position: fixed;
            inset: -20px;
            z-index: -3;
            background-image: url('data man.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            filter: blur(6px) grayscale(100%) contrast(115%);
            opacity: 0.22;
            pointer-events: none;
            transition: opacity 0.45s ease, filter 0.45s ease;
        }
        html:not(.dark) .bg-data-man {
            filter: blur(7px) grayscale(100%) invert(1) contrast(105%);
            opacity: 0.10;
        }

        /* Subtle Vignette Overlay */
        .bg-vignette {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(circle at 50% 30%, rgba(9, 9, 11, 0.45) 0%, rgba(9, 9, 11, 0.92) 85%);
            pointer-events: none;
            transition: background 0.45s ease;
        }
        html:not(.dark) .bg-vignette {
            background: radial-gradient(circle at 50% 30%, rgba(248, 250, 252, 0.55) 0%, rgba(241, 245, 249, 0.92) 85%);
        }

        /* Cursor Ambient Glow Spotlight */
        .cursor-glow {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(
                420px circle at var(--cursor-x) var(--cursor-y),
                rgba(255, 255, 255, 0.09),
                transparent 75%
            );
            transition: opacity 0.3s ease;
        }
        html:not(.dark) .cursor-glow {
            background: radial-gradient(
                420px circle at var(--cursor-x) var(--cursor-y),
                rgba(15, 23, 42, 0.08),
                transparent 75%
            );
        }

        /* Interactive Data-Constellation Canvas */
        #sparkle-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Adaptive Glass Cards with 3D Tilt & Specular Sheen */
        .glass-card {
            position: relative;
            overflow: hidden;
            background: rgba(24, 24, 27, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transform-style: preserve-3d;
            transition: border-color 0.3s ease, box-shadow 0.35s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.4s ease, opacity 0.35s ease;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }
        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
                360px circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.09),
                transparent 65%
            );
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
            z-index: 1;
        }
        .glass-card:hover::before {
            opacity: 1;
        }
        .glass-card:hover {
            border-color: rgba(244, 244, 245, 0.45);
            box-shadow: 0 18px 38px -10px rgba(0, 0, 0, 0.8), 0 0 24px rgba(255, 255, 255, 0.06);
        }

        html:not(.dark) .glass-card {
            background: rgba(255, 255, 255, 0.80);
            border: 1px solid rgba(15, 23, 42, 0.12);
            box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.06);
        }
        html:not(.dark) .glass-card::before {
            background: radial-gradient(
                360px circle at var(--mouse-x) var(--mouse-y),
                rgba(15, 23, 42, 0.06),
                transparent 65%
            );
        }
        html:not(.dark) .glass-card:hover {
            border-color: rgba(15, 23, 42, 0.35);
            box-shadow: 0 18px 36px -10px rgba(15, 23, 42, 0.14);
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
